name: SABT foundation checks

on:
  push:
    branches: [main, "codex/**", "ui/**"]
  pull_request:
    branches: [main]

jobs:
  test-and-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js for UI script validation
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Koko UI JavaScript syntax
        run: |
          node --check app/static/koko-theme-engine.js
          node --check app/static/koko-workspace-tabs.js
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Install Chromium for browser E2E tests
        timeout-minutes: 8
        run: python -m playwright install chromium
      - name: Run test suite
        timeout-minutes: 20
        run: pytest
      - name: Upgrade a fresh SQLite database
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          rm -f sabt.db
          alembic upgrade head
      - name: Verify Alembic head
        run: alembic current
      - name: Verify downgrade and re-upgrade
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic current

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SABT_SKIP_BOOTSTRAP: "1"
      SABT_NO_BROWSER: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify setup refuses to ignore a repository-local database
        shell: pwsh
        run: |
          New-Item -ItemType File -Path "sabt.db" -Force | Out-Null
          cmd /c "call setup.bat && echo unexpected-success > setup-guard-result.txt || echo expected-refusal > setup-guard-result.txt"
          if ((Get-Content "setup-guard-result.txt" -Raw).Trim() -ne "expected-refusal") {
            Remove-Item "sabt.db" -Force
            throw "setup.bat accepted a legacy repository database without an explicit data-directory choice."
          }
          Remove-Item "setup-guard-result.txt" -Force
          Remove-Item "sabt.db" -Force
      - name: Install and migrate using the Windows setup script
        shell: cmd
        run: setup.bat
      - name: Create the initial administrator in the configured Windows data directory
        shell: pwsh
        run: |
          $env:SABT_DATA_DIR = Join-Path $env:LOCALAPPDATA "SABT\data"
          $env:SABT_SMOKE_PARENT_ID = Get-Content (Join-Path $env:RUNNER_TEMP "sabt-parent-contract-id.txt") -Raw
          $env:SABT_SMOKE_OPERATION_ID = Get-Content (Join-Path $env:RUNNER_TEMP "sabt-operation-id.txt") -Raw
          $python = Join-Path $PWD ".venv\Scripts\python.exe"
          $seed = @'
          from app.db.session import SessionLocal
          from app.bootstrap import create_initial_admin

          with SessionLocal.begin() as db:
              create_initial_admin(
                  db,
                  username="windows.admin",
                  display_name="Windows CI Administrator",
                  password="a secure windows ci password",
              )
          '@
          & $python -c $seed
          if ($LASTEXITCODE -ne 0) { throw "Initial administrator seed failed." }
      - name: Start SABT using the Windows launcher
        shell: cmd
        run: start.bat
      - name: Verify health, portal, login, and first project creation
        shell: pwsh
        run: |
          $health = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -UseBasicParsing
          if ($health.StatusCode -ne 200) { throw "Health endpoint failed." }
          $portal = Invoke-WebRequest -Uri "http://127.0.0.1:8000/portal/" -UseBasicParsing
          if ($portal.StatusCode -ne 200) { throw "Portal endpoint failed." }
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("windows.admin:a secure windows ci password"))
          $login = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/auth/login" -Headers @{ Authorization = "Basic $basic" }
          $headers = @{ Authorization = "Bearer $($login.access_token)" }
          $body = @{
            code = "windows-smoke"
            name = "Windows smoke project"
            contract_code = "76"
            timezone = "Asia/Tehran"
          } | ConvertTo-Json
          $project = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/projects" -Headers $headers -ContentType "application/json" -Body $body
          if ($project.id -lt 1) { throw "First project was not created." }
          $projects = Invoke-RestMethod -Uri "http://127.0.0.1:8000/projects" -Headers $headers
          if ($projects.total -ne 1) { throw "First project was not returned by the project list." }
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "sabt-project-id.txt") -Value $project.id
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "sabt-session-token.txt") -Value $login.access_token
          $env:SABT_DATA_DIR = Join-Path $env:LOCALAPPDATA "SABT\data"
          $python = Join-Path $PWD ".venv\Scripts\python.exe"
          & $python scripts/windows_seed_transfer.py $project.id
          if ($LASTEXITCODE -ne 0) { throw "Could not seed project-scoped transfer test data." }
          $seed = Get-Content (Join-Path $env:TEMP "sabt-windows-transfer-seed.json") -Raw | ConvertFrom-Json
          $parentBody = @{ project_id = [int]$project.id; suffix = "0123"; initial_person_id = [int]$seed.initial_owner_id; property_id = [int]$seed.property_id } | ConvertTo-Json
          $parent = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/contracts/parent" -Headers $headers -ContentType "application/json" -Body $parentBody
          if ($parent.contract_number -ne "760123") { throw "Parent Contract did not preserve the six-digit number." }
          $operationBody = @{ project_id = [int]$project.id; operation_type_id = [int]$seed.operation_type_id; property_id = [int]$seed.property_id; parent_contract_id = [int]$parent.id } | ConvertTo-Json
          $operation = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/operations" -Headers $headers -ContentType "application/json" -Body $operationBody
          $partyBody = @{ person_id = [int]$seed.buyer_id; role_id = [int]$seed.buyer_role_id; sequence_no = 1; expected_version = 1 } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/operations/$($operation.operation_id)/parties" -Headers $headers -ContentType "application/json" -Body $partyBody | Out-Null
          $inProgressBody = @{ target_state = "IN_PROGRESS"; expected_version = 2; reason = "Windows smoke" } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/operations/$($operation.operation_id)/transition" -Headers $headers -ContentType "application/json" -Body $inProgressBody | Out-Null
          $readyBody = @{ target_state = "READY_FOR_FINALIZATION"; expected_version = 3; reason = "Windows smoke" } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/operations/$($operation.operation_id)/transition" -Headers $headers -ContentType "application/json" -Body $readyBody | Out-Null
          $finalizeBody = @{ expected_version = 4; reason = "Approved buyer / transferee" } | ConvertTo-Json
          $finalized = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/operations/$($operation.operation_id)/finalize" -Headers $headers -ContentType "application/json" -Body $finalizeBody
          if ($finalized.child_contract_number -ne "760123/1") { throw "Transfer child number was not allocated correctly." }
          $history = Invoke-RestMethod -Uri "http://127.0.0.1:8000/contracts/parent/760123/history" -Headers $headers
          if ($history.current_owner.source -ne "latest_valid_finalized_transfer" -or $history.current_owner.people[0].person_id -ne $seed.buyer_id) { throw "Approved buyer did not become the current owner." }
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "sabt-parent-contract-id.txt") -Value $parent.id
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "sabt-operation-id.txt") -Value $operation.operation_id
          Write-Host "Core contract transfer API passed: 760123/1; approved transferee is current owner."
          $backupDirectory = Join-Path $env:RUNNER_TEMP "sabt-backups"
          $backupPath = & $python -m app.backup create --destination $backupDirectory
          if ($LASTEXITCODE -ne 0) { throw "Online SQLite backup failed." }
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "sabt-backup-path.txt") -Value $backupPath.Trim()
      - name: Stop SABT using the Windows launcher
        shell: cmd
        run: stop.bat
      - name: Change project data after the backup snapshot
        shell: pwsh
        run: |
          $env:SABT_DATA_DIR = Join-Path $env:LOCALAPPDATA "SABT\data"
          $python = Join-Path $PWD ".venv\Scripts\python.exe"
          $env:SABT_SMOKE_PARENT_ID = (Get-Content (Join-Path $env:RUNNER_TEMP "sabt-parent-contract-id.txt") -Raw).Trim()
          $env:SABT_SMOKE_OPERATION_ID = (Get-Content (Join-Path $env:RUNNER_TEMP "sabt-operation-id.txt") -Raw).Trim()
          $mutate = @'
          import os
          from sqlalchemy import select
          from app.db.models import Operation, ParentContract, Project
          from app.db.session import SessionLocal

          with SessionLocal.begin() as db:
              project = db.scalar(select(Project).where(Project.code == "windows-smoke"))
              project.name = "Changed after backup"
              parent = db.get(ParentContract, int(os.environ["SABT_SMOKE_PARENT_ID"]))
              operation = db.get(Operation, int(os.environ["SABT_SMOKE_OPERATION_ID"]))
              parent.next_transfer_sequence = 100
              operation.transfer_sequence = 99
              operation.child_contract_number = f"{parent.contract_number}/99"
          '@
          & $python -c $mutate
          if ($LASTEXITCODE -ne 0) { throw "Could not mutate project data for restore test." }
      - name: Restore the online backup while SABT is stopped
        shell: pwsh
        run: |
          $env:SABT_DATA_DIR = Join-Path $env:LOCALAPPDATA "SABT\data"
          $python = Join-Path $PWD ".venv\Scripts\python.exe"
          $backupPath = Get-Content (Join-Path $env:RUNNER_TEMP "sabt-backup-path.txt") -Raw
          & $python -m app.backup restore $backupPath.Trim() --confirm
          if ($LASTEXITCODE -ne 0) { throw "Offline database restore failed." }
          $safetyBackups = Get-ChildItem (Join-Path $env:LOCALAPPDATA "SABT\backups") -Filter "sabt-pre-restore-*.db"
          if (-not $safetyBackups) { throw "Automatic pre-restore safety backup was not created." }
      - name: Restart SABT using the Windows launcher
        shell: cmd
        run: start.bat
      - name: Verify project and session persistence after restart
        shell: pwsh
        run: |
          $token = Get-Content (Join-Path $env:RUNNER_TEMP "sabt-session-token.txt") -Raw
          $expectedProjectId = [int](Get-Content (Join-Path $env:RUNNER_TEMP "sabt-project-id.txt") -Raw)
          $headers = @{ Authorization = "Bearer $($token.Trim())" }
          $projects = Invoke-RestMethod -Uri "http://127.0.0.1:8000/projects" -Headers $headers
          if ($projects.total -ne 1 -or $projects.items[0].id -ne $expectedProjectId) {
            throw "Project data or authenticated session did not survive server restart."
          }
          if ($projects.items[0].name -ne "Windows smoke project") {
            throw "Backup restore did not restore the pre-mutation project data."
          }
          $seed = Get-Content (Join-Path $env:TEMP "sabt-windows-transfer-seed.json") -Raw | ConvertFrom-Json
          $history = Invoke-RestMethod -Uri "http://127.0.0.1:8000/contracts/parent/760123/history" -Headers $headers
          if ($history.parent.id -ne [int](Get-Content (Join-Path $env:RUNNER_TEMP "sabt-parent-contract-id.txt") -Raw)) { throw "Parent Contract did not survive restore." }
          if ($history.transfers[0].child_contract_number -ne "760123/1" -or $history.transfers[0].transfer_sequence -ne 1) { throw "Transfer child number was not restored from the backup." }
          if ($history.current_owner.source -ne "latest_valid_finalized_transfer" -or $history.current_owner.people[0].person_id -ne $seed.buyer_id) { throw "Approved transferee ownership did not survive backup restore." }
          Write-Host "Verified restored transfer 760123/1 and approved current owner after restart."
          }
      - name: Stop SABT after restart
        shell: cmd
        run: stop.bat
      - name: Verify the server process and PID file are gone
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:LOCALAPPDATA "SABT\run\server.pid"
          if (Test-Path $pidFile) { throw "SABT PID file was not removed." }
          $remaining = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "uvicorn app.main:app" }
          if ($remaining) { throw "SABT server process is still running." }
