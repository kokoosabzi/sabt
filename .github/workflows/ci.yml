name: SABT foundation checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  test-and-migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run test suite
        run: pytest
      - name: Upgrade a fresh SQLite database
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          rm -f sabt.db
          alembic upgrade head
      - name: Verify Alembic head
        run: alembic current
      - name: Verify downgrade and re-upgrade
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic current
